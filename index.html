<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المفضلة - شارات دراما المجد</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --bg-color: #0f172a; 
            --card-bg: #1e293b; 
            --text-color: #f8fafc; 
            --primary-color: #0284c7; 
            --primary-hover: #0369a1; 
            --fav-color: #ef4444; 
            --text-muted: #94a3b8; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2.5rem; font-weight: 900; color: #0ea5e9; margin-bottom: 10px; text-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .controls { display: flex; flex-direction: column; gap: 15px; max-width: 700px; margin: 0 auto 40px auto; align-items: center; }
        .search-container { position: relative; width: 100%; }
        .search-container input { width: 100%; padding: 15px 45px 15px 15px; border-radius: 12px; border: 2px solid #334155; background-color: var(--card-bg); color: var(--text-color); font-size: 1.1rem; outline: none; transition: all 0.3s ease; }
        .search-container input:focus { border-color: var(--primary-color); box-shadow: 0 0 10px rgba(2, 132, 199, 0.5); }
        .search-container i { position: absolute; top: 50%; right: 15px; transform: translateY(-50%); color: var(--text-muted); font-size: 1.2rem; }
        .filter-buttons { display: flex; gap: 10px; }
        .btn { padding: 10px 25px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s ease; font-size: 1rem; }
        .btn-primary { background-color: var(--primary-color); color: #fff; }
        .btn-primary:hover, .btn-primary.active { background-color: var(--primary-hover); }
        .btn-outline { background-color: transparent; border: 2px solid #334155; color: var(--text-color); }
        .btn-outline:hover, .btn-outline.active { background-color: #334155; border-color: #475569; }
        .series-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: var(--card-bg); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); transition: transform 0.3s ease; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); }
        .card-img-container { width: 100%; height: 180px; background-color: #0f172a; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 20px; display: flex; flex-direction: column; gap: 15px; flex-grow: 1; }
        .card-title { font-size: 1.25rem; font-weight: 700; line-height: 1.4; }
        .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .btn-watch { background-color: #10b981; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: background 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-watch:hover { background-color: #059669; }
        .btn-fav { background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; transition: color 0.2s, transform 0.2s; }
        .btn-fav:hover { transform: scale(1.1); }
        .btn-fav.is-fav { color: var(--fav-color); }
        .no-results { text-align: center; grid-column: 1 / -1; padding: 40px; color: var(--text-muted); font-size: 1.2rem; }
        .loading { text-align: center; grid-column: 1 / -1; padding: 40px; font-size: 1.5rem; color: #0ea5e9; }
    </style>
</head>
<body>

    <header>
        <h1>أرشيف دراما المجد</h1>
        <p style="color: var(--text-muted);">البحث والمفضلة التلقائية مباشرة من ملفك</p>
    </header>

    <div class="controls">
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن اسم المسلسل...">
        </div>
        <div class="filter-buttons">
            <button class="btn btn-primary active" id="btnAll">كل المسلسلات</button>
            <button class="btn btn-outline" id="btnFavOnly"><i class="fa-solid fa-heart" style="color: var(--fav-color); margin-left: 5px;"></i> المفضلة (<span id="favCount">0</span>)</button>
        </div>
    </div>

    <div class="series-grid" id="seriesGrid">
        <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل كافة المسلسلات من قوقل شيت...</div>
    </div>

    <script>
        // تم وضع معرف ملفك هنا مباشرة واختصار الوقت عليك!
        const sheetId = '1VkpwSKCoBQ0wiXILLxF6zwR-czCD2z66dMKW9hFh28U';
        const base = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

        let seriesData = [];
        let favorites = JSON.parse(localStorage.getItem('majd_favs')) || [];
        
        const seriesGrid = document.getElementById('seriesGrid');
        const searchInput = document.getElementById('searchInput');
        const btnAll = document.getElementById('btnAll');
        const btnFavOnly = document.getElementById('btnFavOnly');
        const favCountLabel = document.getElementById('favCount');
        let currentFilter = 'all';

        // جلب البيانات تلقائياً بلمحة بصر
        fetch(base)
            .then(res => res.text())
            .then(data => {
                const temp = data.substring(47, data.length - 2);
                const json = JSON.parse(temp);
                const rows = json.table.rows;
                
                // قراءة الأعمدة الثلاثة بالترتيب الآتي من ملفك: الاسم، الشارة، الصورة
                seriesData = rows.map(row => ({
                    name: row.c[0] ? row.c[0].v : '',
                    watchLink: row.c[1] ? row.c[1].v : '#',
                    imgLink: row.c[2] ? row.c[2].v : ''
                })).filter(item => item.name !== '' && item.name !== 'اسم المسلسل');

                renderCards();
            }).catch(err => {
                seriesGrid.innerHTML = '<div class="no-results">تأكد من أنك قمت بجعل خيار مشاركة الملف: "أي شخص لديه الرابط يمكنه العرض".</div>';
            });

        function updateFavCount() { favCountLabel.textContent = favorites.length; }

        function renderCards() {
            seriesGrid.innerHTML = '';
            const searchTerm = searchInput.value.trim().toLowerCase();
            const filteredData = seriesData.filter(item => {
                const matchesSearch = item.name && item.name.toLowerCase().includes(searchTerm);
                const matchesFilter = currentFilter === 'all' || favorites.includes(item.name);
                return matchesSearch && matchesFilter;
            });

            if (filteredData.length === 0) {
                seriesGrid.innerHTML = '<div class="no-results">لا توجد نتائج مطابقة لبحثك.</div>';
                return;
            }

            filteredData.forEach(item => {
                const isFav = favorites.includes(item.name);
                const card = document.createElement('div');
                card.className = 'card';
                const finalImg = item.imgLink && item.imgLink !== '-' ? item.imgLink : 'https://images.unsplash.com/photo-1616469829581-73993eb86b02?q=80&w=300';

                card.innerHTML = `
                    <div class="card-img-container"><img src="${finalImg}" alt="${item.name}" loading="lazy"></div>
                    <div class="card-content">
                        <h3 class="card-title">${item.name}</h3>
                        <div class="card-actions">
                            <a href="${item.watchLink}" target="_blank" class="btn-watch"><i class="fa-solid fa-play"></i> الشارة</a>
                            <button class="btn-fav ${isFav ? 'is-fav' : ''}" onclick="toggleFavorite('${item.name.replace(/'/g, "\\'")}')">
                                <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                            </button>
                        </div>
                    </div>`;
                seriesGrid.appendChild(card);
            });
            updateFavCount();
        }

        window.toggleFavorite = function(name) {
            if (favorites.includes(name)) { favorites = favorites.filter(fav => fav !== name); } 
            else { favorites.push(name); }
            localStorage.setItem('majd_favs', JSON.stringify(favorites));
            renderCards();
        }

        searchInput.addEventListener('input', renderCards);
        btnAll.addEventListener('click', () => { currentFilter = 'all'; btnAll.classList.replace('btn-outline', 'btn-primary'); btnFavOnly.classList.replace('btn-primary', 'btn-outline'); renderCards(); });
        btnFavOnly.addEventListener('click', () => { currentFilter = 'fav'; btnFavOnly.classList.replace('btn-outline', 'btn-primary'); btnAll.classList.replace('btn-primary', 'btn-outline'); renderCards(); });

        updateFavCount();
    </script>
</body>
</html>
