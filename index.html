<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شارات دراما المجد</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0a0a0a; color: #ffffff; font-family: 'Tajawal', sans-serif; margin: 0; padding: 20px; }
        .header-logo { text-align: right; margin-bottom: 20px; }
        .header-logo img { width: 80px; }
        
        /* تركيز المدخلات في المنتصف */
        .add-form { background: #141414; border: 1px solid #ffd700; border-radius: 12px; padding: 20px; margin: 0 auto 30px auto; max-width: 500px; }
        .form-group { margin-bottom: 15px; text-align: center; }
        input { width: 90%; padding: 10px; background: #222; border: 1px solid #444; border-radius: 6px; color: #fff; text-align: center; }
        
        h2 { color: #ffd700; text-align: center; border-bottom: 2px solid #ffd700; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-top: 15px; }
        .card { background: #141414; border: 1px solid #252525; border-radius: 12px; padding: 10px; text-align: center; }
        .btn { background: #ffd700; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-remove { background: #ff4d4d; color: white; margin-top: 10px; padding: 5px; }
    </style>
</head>
<body>

    <div class="header-logo"><img src="https://files.catbox.moe/0hkqh4.png" alt="شعار"></div>

    <div class="add-form">
        <h3>➕ إضافة شارة جديدة</h3>
        <div class="form-group"><input type="text" id="showTitle" placeholder="اسم المسلسل"></div>
        <div class="form-group"><input type="url" id="showImg" placeholder="رابط صورة الكرت (اختياري)"></div>
        <div class="form-group"><input type="url" id="showLink" placeholder="رابط شارة (داخل موقع شارات دراما المجد فقط)"></div>
        <button class="btn" onclick="addNewShow()">💾 حفظ في مكتبتي</button>
    </div>

    <h2>📁 مكتبة شاراتي المفضلة</h2>
    <div class="grid" id="fav-sharat"></div>

<script>
    let myCustomSharat = JSON.parse(localStorage.getItem('userCustomSharat')) || [];

    function addNewShow() {
        const title = document.getElementById('showTitle').value;
        const link = document.getElementById('showLink').value;
        const img = document.getElementById('showImg').value || "https://via.placeholder.com/160x110/222222/ffffff?text=Drama";

        // التحقق من أن الرابط من موقع المجد فقط
        if (!link.includes("sites.google.com/view/almajddrama/")) {
            alert("عذراً، يرجى إضافة روابط من موقع شارات دراما المجد فقط!");
            return;
        }

        const newShow = { id: Date.now(), title, img, link };
        myCustomSharat.push(newShow);
        localStorage.setItem('userCustomSharat', JSON.stringify(myCustomSharat));
        renderMySharat();
    }

    function renderMySharat() {
        const container = document.getElementById('fav-sharat');
        container.innerHTML = myCustomSharat.map(item => `
            <div class="card">
                <img src="${item.img}" style="width:100%; height:110px; object-fit:cover;">
                <p>${item.title}</p>
                <a href="${item.link}" target="_blank" style="color:#ffd700;">مشاهدة الشارة</a><br>
                <button class="btn btn-remove" onclick="removeShow(${item.id})">حذف</button>
            </div>
        `).join('');
    }

    function removeShow(id) {
        myCustomSharat = myCustomSharat.filter(i => i.id !== id);
        localStorage.setItem('userCustomSharat', JSON.stringify(myCustomSharat));
        renderMySharat();
    }

    renderMySharat();
</script>
</body>
</html>
