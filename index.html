<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شارات دراما المجد</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --bg-color: #0f172a; 
            --card-bg: #1e293b; 
            --text-color: #f8fafc; 
            --primary-color: #0284c7; 
            --primary-hover: #0369a1; 
            --fav-color: #ef4444; 
            --text-muted: #94a3b8; 
            --ad-bg-1: linear-gradient(135deg, #1e3a8a 0%, #0ea5e9 100%);
            --ad-bg-2: linear-gradient(135deg, #111827 0%, #312e81 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 15px; 
            overflow-x: hidden;
        }
        
        header { 
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px; 
            min-height: 90px;
        }
        .logo {
            width: 100%;
            max-width: 160px;
            height: auto;
            object-fit: contain;
            transition: all 0.3s ease;
        }

        /* شريط التنقل الجديد باستخدام شعارات القنوات الرسمية والأيقونات الدائرية الموفقة */
        .channel-nav {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 25px auto;
            overflow-x: auto;
            padding: 5px 10px 10px 10px;
            justify-content: flex-start;
            align-items: center;
        }
        @media (min-width: 900px) {
            .channel-nav { justify-content: center; }
        }
        .channel-nav::-webkit-scrollbar { height: 4px; }
        .channel-nav::-webkit-scrollbar-thumb { background: var(--card-bg); border-radius: 4px; }

        .nav-tab {
            padding: 8px 16px;
            border-radius: 50px;
            border: 2px solid #334155;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .nav-tab img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            border-radius: 4px;
        }
        .nav-tab i {
            font-size: 1.05rem;
        }
        .nav-tab.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }

        .controls { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            width: 100%;
            max-width: 550px; 
            margin: 0 auto 20px auto; 
            align-items: center; 
        }
        
        .search-container { position: relative; width: 100%; }
        .search-container input { 
            width: 100%; 
            padding: 12px 40px 12px 15px; 
            border-radius: 10px; 
            border: 2px solid #334155; 
            background-color: var(--card-bg); 
            color: var(--text-color); 
            font-size: 1rem; 
            outline: none; 
        }
        .search-container i { 
            position: absolute; 
            top: 50%; 
            right: 15px; 
            transform: translateY(-50%); 
            color: var(--text-muted); 
        }

        .section-title {
            max-width: 1100px;
            margin: 15px auto 15px auto;
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--text-color);
            border-right: 4px solid var(--primary-color);
            padding-right: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ستايل الـ Grid الثابت والموحد (3 أعمدة دائماً) */
        .series-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
            width: 100%;
            max-width: 1100px; 
            margin: 0 auto 20px auto; 
        }

        .card { 
            background-color: var(--card-bg); 
            border-radius: 10px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); }
        .card-img-container { width: 100%; height: 120px; background-color: #0f172a; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-content { 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            flex-grow: 1; 
        }
        .card-title { font-size: 0.95rem; font-weight: 700; line-height: 1.3; }
        .card-actions { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: auto; 
        }
        
        .btn-watch { 
            background-color: #10b981; 
            color: white; 
            padding: 5px 10px; 
            border-radius: 6px; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 0.75rem; 
            display: inline-flex; 
            align-items: center; 
            gap: 4px; 
        }
        
        .btn-fav { 
            background: none; 
            border: none; 
            color: var(--text-muted); 
            font-size: 1.15rem; 
            cursor: pointer; 
        }
        .btn-fav.is-fav { color: var(--fav-color); }

        /* ستايل المربعات الإعلانية الكتابية التسويقية */
        .ad-card {
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px dashed rgba(255,255,255,0.2);
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .ad-card:hover { transform: scale(1.02); border-color: #fff; }
        .ad-card-1 { background: var(--ad-bg-1); }
        .ad-card-2 { background: var(--ad-bg-2); }
        .ad-badge { background-color: #f59e0b; color: #000; font-size: 0.65rem; font-weight: 900; padding: 2px 6px; border-radius: 4px; margin-bottom: 8px; text-transform: uppercase; }
        .ad-title { font-size: 1rem; font-weight: 900; margin-bottom: 6px; }
        .ad-desc { font-size: 0.75rem; opacity: 0.9; line-height: 1.4; }
        .ad-link-btn { margin-top: 12px; background: #fff; color: #0f172a; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }

        .no-results { 
            text-align: center; 
            grid-column: 1 / -1; 
            width: 100%;
            padding: 40px 15px; 
            color: var(--text-muted); 
            font-size: 1rem; 
            line-height: 1.6;
        }
        .loading { 
            text-align: center; 
            grid-column: 1 / -1; 
            width: 100%;
            padding: 30px; 
            font-size: 1rem; 
            color: #0ea5e9; 
        }

        /* غلاف الجدول اليومي */
        .tg-responsive-wrapper {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            display: none; 
            justify-content: center;
            overflow: hidden;
        }
        .tg-responsive-wrapper iframe {
            width: 100% !important;
            border: none !important;
        }

        /* الشاشات الكبيرة (اللابتوب والتابلت) */
        @media (min-width: 900px) {
            .series-grid { grid-template-columns: repeat(4, 1fr); gap: 15px; }
            .card-img-container { height: 140px; }
            .card-title { font-size: 1.05rem; }
            .ad-card { grid-column: auto; } /* حجم عادي كباقي الكروت على اللابتوب */
        }
        
        /* شاشات الجوال (تعديل أحجام الكروت وتكبير الإعلانات لتكون بارزة) */
        @media (max-width: 500px) {
            body { padding: 8px; }
            .series-grid { gap: 6px; }
            .card-content { padding: 6px; gap: 6px; }
            .card-title { font-size: 0.75rem; }
            .card-img-container { height: 75px; }
            .btn-watch { padding: 4px 6px; font-size: 0.65rem; gap: 2px; }
            .btn-fav { font-size: 0.95rem; }
            .logo { max-width: 130px; }
            .nav-tab { padding: 8px 12px; font-size: 0.8rem; }
            .section-title { font-size: 0.95rem; margin: 10px 5px; }
            
            /* جعل الإعلانات أكبر وممتدة على الجوال لسهولة الضغط */
            .ad-card { grid-column: span 2; padding: 20px 15px; }
            .ad-title { font-size: 1.1rem; }
            .ad-desc { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <header>
        <img id="mainLogo" src="https://files.catbox.moe/ieu2w1.png" alt="شعارات دراما المجد" class="logo">
    </header>

    <div class="channel-nav">
        <button class="nav-tab active" onclick="switchChannel('home')"><i class="fa-solid fa-house"></i> الرئيسية</button>
        <button class="nav-tab" onclick="switchChannel('schedule')"><i class="fa-solid fa-calendar-days"></i> الجدول اليومي</button>
        <button class="nav-tab" onclick="switchChannel('general')"><img src="https://files.catbox.moe/8i7vio.png" alt="العامة"> العامة</button>
        <button class="nav-tab" onclick="switchChannel('kids')"><img src="https://files.catbox.moe/h3ytss.webp" alt="الأطفال"> الأطفال</button>
        <button class="nav-tab" onclick="switchChannel('massa')"><img src="https://files.catbox.moe/r8i1hh.webp" alt="ماسة"> ماسة</button>
        <button class="nav-tab" onclick="switchChannel('fav')"><i class="fa-solid fa-heart" style="color: var(--fav-color);"></i> المفضلة (<span id="favCount">0</span>)</button>
    </div>

    <div class="controls" id="controlsBox">
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن أي مسلسل هنا..." autocomplete="off">
        </div>
    </div>

    <div id="homeTitles" style="display:none;">
        <div class="section-title"><i class="fa-solid fa-wand-magic-sparkles" style="color: #f59e0b;"></i> شارات مقترحة لك (عشوائي)</div>
    </div>

    <div class="series-grid" id="seriesGrid">
        <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> جاري جلب البيانات وتجهيز البوابة...</div>
    </div>

    <div class="tg-responsive-wrapper" id="telegramSchedule">
        <script async src="https://telegram.org/js/telegram-widget.js?23" 
                data-telegram-post="Almajddrama/300" 
                data-width="100%" 
                data-dark="1">
        </script>
    </div>

    <script>
        const channels = {
            general: { sheetId: '1rHPnFHgZXodViTKG0r9TMtiIEG1HgwIZSHY-BaXSyL8', logo: 'https://files.catbox.moe/8i7vio.png' },
            kids: { sheetId: '1Fv0aVmC9l_MXb91v9t2C0WruP5G8wVtTW_lwusfNiHY', logo: 'https://files.catbox.moe/h3ytss.webp' },
            massa: { sheetId: '1_84tvgCQGVy_P5_I6BNIJ7K5jJ1qKxuPiCH7fzALlCQ', logo: 'https://files.catbox.moe/r8i1hh.webp' }
        };

        let activeTab = 'home';
        let allDataMap = { general: [], kids: [], massa: [] }; 
        let favorites = JSON.parse(localStorage.getItem('majd_favs')) || [];

        const mainLogo = document.getElementById('mainLogo');
        const seriesGrid = document.getElementById('seriesGrid');
        const homeTitles = document.getElementById('homeTitles');
        const controlsBox = document.getElementById('controlsBox');
        const telegramSchedule = document.getElementById('telegramSchedule');
        const searchInput = document.getElementById('searchInput');
        const favCountLabel = document.getElementById('favCount');

        // جلب البيانات الكلية فور فتح الصفحة لضمان سرعة الانتقال الفوري
        async function fetchAllData() {
            const fetchPromises = Object.keys(channels).map(key => {
                const url = `https://docs.google.com/spreadsheets/d/${channels[key].sheetId}/gviz/tq?tqx=out:json`;
                return fetch(url)
                    .then(res => res.text())
                    .then(data => {
                        const temp = data.substring(47, data.length - 2);
                        const json = JSON.parse(temp);
                        allDataMap[key] = json.table.rows.map(row => ({
                            name: row.c[0] ? row.c[0].v : '',
                            watchLink: row.c[1] ? row.c[1].v : '#',
                            imgLink: row.c[2] ? row.c[2].v : '',
                            origin: key
                        })).filter(item => item.name !== '' && item.name !== 'اسم المسلسل');
                    }).catch(err => console.error("Error loading " + key, err));
            });

            await Promise.all(fetchPromises);
            switchChannel('home'); 
            updateFavCount();
        }

        function updateFavCount() { favCountLabel.textContent = favorites.length; }

        function createCardHtml(item) {
            const isFav = favorites.includes(item.name);
            const finalImg = item.imgLink && item.imgLink !== '-' ? item.imgLink : 'https://images.unsplash.com/photo-1616469829581-73993eb86b02?q=80&w=300';
            return `
                <div class="card">
                    <div class="card-img-container"><img src="${finalImg}" alt="${item.name}" loading="lazy"></div>
                    <div class="card-content">
                        <h3 class="card-title">${item.name}</h3>
                        <div class="card-actions">
                            <a href="${item.watchLink}" target="_blank" class="btn-watch"><i class="fa-solid fa-play"></i> الشارة</a>
                            <button class="btn-fav ${isFav ? 'is-fav' : ''}" onclick="toggleFavorite('${item.name.replace(/'/g, "\\'")}')">
                                <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
        }

        // كروت الإعلانات الكتابية التسويقية
        const adCard1Html = `
            <a href="https://store.almajdtv.com" target="_blank" class="ad-card ad-card-1">
                <div class="ad-badge">إعلان متجر المجد</div>
                <div class="ad-title">اشترك الآن في شبكة المجد</div>
                <div class="ad-desc">تابع باقتك العائلية المفضلة بأعلى دقة وبدون فواصل عبر المتجر الرسمي.</div>
                <div class="ad-link-btn">اضغط للاشتراك <i class="fa-solid fa-chevron-left"></i></div>
            </a>`;

        const adCard2Html = `
            <a href="https://portal.almajdtv.com/ords/f?p=109:3" target="_blank" class="ad-card ad-card-2">
                <div class="ad-badge" style="background-color: #10b981;">تجديد سريع</div>
                <div class="ad-title">جدد اشتراكك الحالي فوراً</div>
                <div class="ad-desc">لا تدع متعة المشاهدة تتوقف، كبسة زر واحدة وتجدد اشتراك رسيفر المجد.</div>
                <div class="ad-link-btn">اضغط للتجديد <i class="fa-solid fa-chevron-left"></i></div>
            </a>`;

        function renderContent() {
            seriesGrid.innerHTML = '';
            const searchTerm = searchInput.value.trim().toLowerCase();

            // 1. نظام تصفية وعرض الصفحة الرئيسية (9 كروت عشوائية ومربعين إعلانيين متناسقين)
            if (activeTab === 'home') {
                let combinedData = [...allDataMap.general, ...allDataMap.kids, ...allDataMap.massa];
                
                if (searchTerm !== '') {
                    homeTitles.style.display = 'none';
                    combinedData = combinedData.filter(item => item.name.toLowerCase().includes(searchTerm));
                    if (combinedData.length === 0) {
                        seriesGrid.innerHTML = '<div class="no-results">لم يتم العثور على نتائج للبحث.</div>';
                        return;
                    }
                    combinedData.forEach(item => seriesGrid.innerHTML += createCardHtml(item));
                } else {
                    homeTitles.style.display = 'block';
                    // جلب 9 مسلسلات فريدة عشوائياً للرئيسية لمنع التكرار المزعج
                    const shuffled = combinedData.filter((v, i, s) => s.findIndex(t => t.name === v.name) === i).sort(() => 0.5 - Math.random());
                    const selected9 = shuffled.slice(0, 9);

                    selected9.forEach((item, index) => {
                        seriesGrid.innerHTML += createCardHtml(item);
                        // حقن الإعلان الأول بعد الكرت الثالث
                        if (index === 2) { seriesGrid.innerHTML += adCard1Html; }
                        // حقن الإعلان الثاني بعد الكرت السادس
                        if (index === 5) { seriesGrid.innerHTML += adCard2Html; }
                    });
                }
            } 
            // 2. نظام المفضلة
            else if (activeTab === 'fav') {
                homeTitles.style.display = 'none';
                let combinedData = [...allDataMap.general, ...allDataMap.kids, ...allDataMap.massa];
                let favData = combinedData.filter(item => favorites.includes(item.name));

                if (searchTerm !== '') {
                    favData = favData.filter(item => item.name.toLowerCase().includes(searchTerm));
                }

                let uniqueFavData = favData.filter((value, index, self) => self.findIndex(t => t.name === value.name) === index);

                if (uniqueFavData.length === 0) {
                    seriesGrid.innerHTML = '<div class="no-results">قائمة المفضلة فارغة حالياً أو لا تطابق البحث.</div>';
                    return;
                }
                uniqueFavData.forEach(item => seriesGrid.innerHTML += createCardHtml(item));
            } 
            // 3. قنوات البث الفردية الكاملة مباشرة (العامة، الأطفال، ماسة)
            else {
                homeTitles.style.display = 'none';
                let channelData = allDataMap[activeTab] || [];
                
                if (searchTerm !== '') {
                    channelData = channelData.filter(item => item.name.toLowerCase().includes(searchTerm));
                }

                if (channelData.length === 0) {
                    seriesGrid.innerHTML = '<div class="no-results">لا توجد مسلسلات متوفرة تطابق البحث.</div>';
                    return;
                }
                channelData.forEach(item => seriesGrid.innerHTML += createCardHtml(item));
            }
        }

        window.toggleFavorite = function(name) {
            if (favorites.includes(name)) { favorites = favorites.filter(fav => fav !== name); } 
            else { favorites.push(name); }
            localStorage.setItem('majd_favs', JSON.stringify(favorites));
            updateFavCount();
            renderContent();
        }

        window.switchChannel = function(tabName) {
            activeTab = tabName;
            
            const tabs = document.querySelectorAll('.nav-tab');
            tabs.forEach(tab => tab.classList.remove('active'));
            
            if(event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            } else {
                document.querySelector('.nav-tab').classList.add('active');
            }

            searchInput.value = '';
            telegramSchedule.style.display = 'none';
            controlsBox.style.display = 'flex';
            seriesGrid.style.display = 'grid';

            if (tabName === 'home') {
                mainLogo.src = 'https://files.catbox.moe/ieu2w1.png'; 
            } else if (tabName === 'schedule') {
                controlsBox.style.display = 'none';
                seriesGrid.style.display = 'none';
                telegramSchedule.style.display = 'flex';
                homeTitles.style.display = 'none';
                mainLogo.src = 'https://files.catbox.moe/ieu2w1.png';
                return;
            } else if (tabName === 'fav') {
                mainLogo.src = 'https://files.catbox.moe/ieu2w1.png'; 
            } else {
                mainLogo.src = channels[tabName].logo;
            }

            renderContent();
        }

        searchInput.addEventListener('input', renderContent);
        fetchAllData();
    </script>
</body>
</html>
