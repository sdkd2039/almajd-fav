<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصتي الشخصية لشارات المجد</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #ffd700;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 10px;
            font-size: 1.4rem;
            margin-top: 30px;
            font-weight: 700;
        }

        /* تنسيق صندوق إضافة المسلسلات */
        .add-form {
            background: #141414;
            border: 1px solid #ffd700;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            max-width: 500px;
        }

        .add-form h3 {
            margin-top: 0;
            color: #ffd700;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #bbb;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #222;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-family: 'Tajawal', sans-serif;
        }

        .form-group input:focus {
            border-color: #ffd700;
            outline: none;
        }

        /* شبكة العرض */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        /* تصميم الكرت النظيف (بدون ملامح) */
        .card {
            background: #141414;
            border: 1px solid #252525;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 12px;
            transition: transform 0.3s, border-color 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #ffd700;
        }

        .card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            background: #222;
        }

        .card-title {
            font-size: 0.95rem;
            margin: 10px 5px 5px 5px;
            font-weight: 500;
            display: block;
            color: #ffffff;
            text-decoration: none;
        }

        .btn {
            background: none;
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 8px 15px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
        }

        .btn:hover {
            background: #ffd700;
            color: #000000;
        }

        .btn-submit {
            background: #ffd700;
            color: #000;
            width: 100%;
        }

        .btn-remove {
            border-color: #ff4d4d;
            color: #ff4d4d;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-remove:hover {
            background: #ff4d4d;
            color: #ffffff;
        }

        .empty-msg {
            color: #666;
            text-align: center;
            font-size: 0.95rem;
            grid-column: 1 / -1;
            padding: 30px 0;
        }
    </style>
</head>
<body>

    <div class="add-form">
        <h3>➕ أضف شارة مسلسل جديدة لقائمتك</h3>
        <div class="form-group">
            <label>اسم المسلسل:</label>
            <input type="text" id="showTitle" placeholder="مثال: مسلسل مطبات">
        </div>
        <div class="form-group">
            <label>رابط صورة الكرت (إذا لم يتوفر اتركها فارغة):</label>
            <input type="url" id="showImg" placeholder="https://files.catbox.moe/...">
        </div>
        <div class="form-group">
            <label>رابط فيديو الشارة:</label>
            <input type="url" id="showLink" placeholder="رابط اليوتيوب أو التليجرام">
        </div>
        <button class="btn btn-submit" onclick="addNewShow()">إضافة إلى شاراتي ❤️</button>
    </div>

    <h2>❤️ مكتبة شاراتي المفضلة</h2>
    <div class="grid" id="fav-sharat"></div>

<script>
    // جلب البيانات المخزنة من متصفح الزائر (لو دخل بعد سنة يلقاها محفوظة)
    let myCustomSharat = JSON.parse(localStorage.getItem('userCustomSharat')) || [];

    // دالة لعرض الشارات التي أضافها الزائر
    function renderMySharat() {
        const container = document.getElementById('fav-sharat');
        
        if (myCustomSharat.length === 0) {
            container.innerHTML = '<p class="empty-msg">قائمتك فارغة! استخدم النموذج بالأعلى لإضافة أي شارة تبيها فوراً.</p>';
            return;
        }

        container.innerHTML = myCustomSharat.map(item => `
            <div class="card">
                <img src="${item.img}" alt="${item.title}">
                <a class="card-title" href="${item.link}" target="_blank">${item.title}</a>
                <button class="btn btn-remove" onclick="removeShow(${item.id})">❌ حذف من القائمة</button>
            </div>
        `).join('');
    }

    // دالة إضافة مسلسل جديد من المدخلات
    window.addNewShow = function() {
        const titleInput = document.getElementById('showTitle').value.trim();
        let imgInput = document.getElementById('showImg').value.trim();
        const linkInput = document.getElementById('showLink').value.trim();

        // التحقق من المدخلات الأساسية
        if (!titleInput || !linkInput) {
            alert("فضلاً املأ اسم المسلسل ورابط الفيديو على الأقل!");
            return;
        }

        // إذا لم يضع صورة، نضع له خلفية رمادية أو صورة مؤقتة افتراضية
        if (!imgInput) {
            imgInput = "https://via.placeholder.com/160x110/222222/ffffff?text=Drama";
        }

        // إنشاء كائن المسلسل الجديد مع id معتمد على الوقت الحالي لضمان عدم التكرار
        const newShow = {
            id: Date.now(),
            title: titleInput,
            img: imgInput,
            link: linkInput
        };

        // حفظ في المصفوفة والتخزين المحلي
        myCustomSharat.push(newShow);
        localStorage.setItem('userCustomSharat', JSON.stringify(myCustomSharat));

        // تحديث الشاشة وتفريغ الحقول
        renderMySharat();
        document.getElementById('showTitle').value = "";
        document.getElementById('showImg').value = "";
        document.getElementById('showLink').value = "";
    }

    // دالة حذف مسلسل من القائمة
    window.removeShow = function(id) {
        myCustomSharat = myCustomSharat.filter(item => item.id !== id);
        localStorage.setItem('userCustomSharat', JSON.stringify(myCustomSharat));
        renderMySharat();
    }

    // تشغيل العرض عند بداية فتح الصفحة
    renderMySharat();
</script>

</body>
</html>
