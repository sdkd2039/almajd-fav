<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة دراما المجد الموحدة</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --bg-color: #0f172a; 
            --card-bg: #1e293b; 
            --text-color: #f8fafc; 
            --primary-color: #0284c7; 
            --primary-hover: #0369a1; 
            --fav-color: #ef4444; 
            --text-muted: #94a3b8; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 15px; 
            overflow-x: hidden;
        }
        
        header { 
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px; 
            min-height: 90px;
        }
        .logo {
            width: 100%;
            max-width: 160px;
            height: auto;
            object-fit: contain;
            transition: all 0.3s ease;
        }

        /* شريط الأقسام الستة المتطور */
        .channel-nav {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto 20px auto;
            overflow-x: auto;
            padding-bottom: 8px;
            justify-content: flex-start;
        }
        /* دعم التوسط في الشاشات الكبيرة */
        @media (min-width: 900px) {
            .channel-nav { justify-content: center; }
        }
        .channel-nav::-webkit-scrollbar { height: 4px; }
        .channel-nav::-webkit-scrollbar-thumb { background: var(--card-bg); border-radius: 4px; }

        .nav-tab {
            padding: 10px 16px;
            border-radius: 12px;
            border: 2px solid #334155;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .nav-tab.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .controls { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            width: 100%;
            max-width: 550px; 
            margin: 0 auto 20px auto; 
            align-items: center; 
        }
        
        .search-container { position: relative; width: 100%; }
        .search-container input { 
            width: 100%; 
            padding: 12px 40px 12px 15px; 
            border-radius: 10px; 
            border: 2px solid #334155; 
            background-color: var(--card-bg); 
            color: var(--text-color); 
            font-size: 1rem; 
            outline: none; 
        }
        .search-container i { 
            position: absolute; 
            top: 50%; 
            right: 15px; 
            transform: translateY(-50%); 
            color: var(--text-muted); 
        }

        /* عنوان فرعي للأقسام داخل الصفحة الرئيسية */
        .section-title {
            max-width: 1100px;
            margin: 15px auto 10px auto;
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--text-color);
            border-right: 4px solid var(--primary-color);
            padding-right: 8px;
        }

        /* ستايل اللابتوب الموحد والثابت (3 أعمدة دائماً على جميع الأجهزة) */
        .series-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
            width: 100%;
            max-width: 1100px; 
            margin: 0 auto 20px auto; 
        }

        .card { 
            background-color: var(--card-bg); 
            border-radius: 10px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .card-img-container { width: 100%; height: 120px; background-color: #0f172a; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-content { 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            flex-grow: 1; 
        }
        .card-title { font-size: 0.95rem; font-weight: 700; line-height: 1.3; }
        .card-actions { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: auto; 
        }
        
        .btn-watch { 
            background-color: #10b981; 
            color: white; 
            padding: 5px 10px; 
            border-radius: 6px; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 0.75rem; 
            display: inline-flex; 
            align-items: center; 
            gap: 4px; 
        }
        
        .btn-fav { 
            background: none; 
            border: none; 
            color: var(--text-muted); 
            font-size: 1.15rem; 
            cursor: pointer; 
        }
        .btn-fav.is-fav { color: var(--fav-color); }

        .no-results { 
            text-align: center; 
            grid-column: 1 / -1; 
            width: 100%;
            padding: 40px 15px; 
            color: var(--text-muted); 
            font-size: 1rem; 
            line-height: 1.6;
        }
        .loading { 
            text-align: center; 
            grid-column: 1 / -1; 
            width: 100%;
            padding: 30px; 
            font-size: 1rem; 
            color: #0ea5e9; 
        }

        /* غلاف الجدول اليومي */
        .tg-responsive-wrapper {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            display: none; 
            justify-content: center;
            overflow: hidden;
        }
        .tg-responsive-wrapper iframe {
            width: 100% !important;
            border: none !important;
        }

        @media (min-width: 900px) {
            .series-grid { grid-template-columns: repeat(4, 1fr); gap: 15px; }
            .card-img-container { height: 140px; }
            .card-title { font-size: 1.05rem; }
        }
        
        @media (max-width: 500px) {
            body { padding: 8px; }
            .series-grid { gap: 6px; }
            .card-content { padding: 6px; gap: 6px; }
            .card-title { font-size: 0.75rem; }
            .card-img-container { height: 75px; }
            .btn-watch { padding: 4px 6px; font-size: 0.65rem; gap: 2px; }
            .btn-fav { font-size: 0.95rem; }
            .logo { max-width: 130px; }
            .nav-tab { padding: 8px 12px; font-size: 0.8rem; }
            .section-title { font-size: 0.95rem; margin: 10px 5px; }
        }
    </style>
</head>
<body>

    <header>
        <img id="mainLogo" src="https://files.catbox.moe/ieu2w1.png" alt="شعارات دراما المجد" class="logo">
    </header>

    <div class="channel-nav">
        <button class="nav-tab active" onclick="switchChannel('home')"><i class="fa-solid fa-house"></i> الرئيسية</button>
        <button class="nav-tab" onclick="switchChannel('schedule')"><i class="fa-solid fa-calendar-days"></i> الجدول اليومي</button>
        <button class="nav-tab" onclick="switchChannel('general')"><i class="fa-solid fa-tv"></i> العامة</button>
        <button class="nav-tab" onclick="switchChannel('kids')"><i class="fa-solid fa-child"></i> الأطفال</button>
        <button class="nav-tab" onclick="switchChannel('massa')"><i class="fa-solid fa-gem"></i> ماسة</button>
        <button class="nav-tab" onclick="switchChannel('fav')"><i class="fa-solid fa-heart" style="color: var(--fav-color);"></i> المفضلة (<span id="favCount">0</span>)</button>
    </div>

    <div class="controls" id="controlsBox">
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن أي مسلسل هنا..." autocomplete="off">
        </div>
    </div>

    <div id="homeTitles" style="display:none;">
        <div class="section-title"><i class="fa-solid fa-wand-magic-sparkles"></i> شارات مقترحة لك (عشوائي)</div>
        <div class="series-grid" id="randomGrid"></div>
        <div class="section-title"><i class="fa-solid fa-fire"></i> جميع شارات الشبكة المتاحة</div>
    </div>

    <div class="series-grid" id="seriesGrid">
        <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> جاري جلب البيانات وتجهيز البوابة...</div>
    </div>

    <div class="tg-responsive-wrapper" id="telegramSchedule">
        <script async src="https://telegram.org/js/telegram-widget.js?23" 
                data-telegram-post="Almajddrama/300" 
                data-width="100%" 
                data-dark="1">
        </script>
    </div>

    <script>
        // روابط قوقل شيت والشعارات الخاصة بكل قناة
        const channels = {
            general: {
                sheetId: '1rHPnFHgZXodViTKG0r9TMtiIEG1HgwIZSHY-BaXSyL8',
                logo: 'https://files.catbox.moe/8i7vio.png'
            },
            kids: {
                sheetId: '1Fv0aVmC9l_MXb91v9t2C0WruP5G8wVtTW_lwusfNiHY',
                logo: 'https://files.catbox.moe/h3ytss.webp'
            },
            massa: {
                sheetId: '1_84tvgCQGVy_P5_I6BNIJ7K5jJ1qKxuPiCH7fzALlCQ',
                logo: 'https://files.catbox.moe/r8i1hh.webp'
            }
        };

        let activeTab = 'home';
        let allDataMap = { general: [], kids: [], massa: [] }; // لتخزين كافة البيانات
        let favorites = JSON.parse(localStorage.getItem('majd_favs')) || [];

        const mainLogo = document.getElementById('mainLogo');
        const seriesGrid = document.getElementById('seriesGrid');
        const randomGrid = document.getElementById('randomGrid');
        const homeTitles = document.getElementById('homeTitles');
        const controlsBox = document.getElementById('controlsBox');
        const telegramSchedule = document.getElementById('telegramSchedule');
        const searchInput = document.getElementById('searchInput');
        const favCountLabel = document.getElementById('favCount');

        // جلب البيانات من كافة الشيتات دفعة واحدة عند تحميل الصفحة لسرعة استجابة فائقة
        async function fetchAllData() {
            const fetchPromises = Object.keys(channels).map(key => {
                const url = `https://docs.google.com/spreadsheets/d/${channels[key].sheetId}/gviz/tq?tqx=out:json`;
                return fetch(url)
                    .then(res => res.text())
                    .then(data => {
                        const temp = data.substring(47, data.length - 2);
                        const json = JSON.parse(temp);
                        allDataMap[key] = json.table.rows.map(row => ({
                            name: row.c[0] ? row.c[0].v : '',
                            watchLink: row.c[1] ? row.c[1].v : '#',
                            imgLink: row.c[2] ? row.c[2].v : '',
                            origin: key
                        })).filter(item => item.name !== '' && item.name !== 'اسم المسلسل');
                    }).catch(err => console.error("Error loading " + key, err));
            });

            await Promise.all(fetchPromises);
            switchChannel('home'); // فتح الصفحة الرئيسية افتراضياً بعد اكتمال التحميل
            updateFavCount();
        }

        function updateFavCount() { favCountLabel.textContent = favorites.length; }

        // دالة إنشاء كرت المسلسل بناءً على البيانات المُمررة
        function createCardHtml(item) {
            const isFav = favorites.includes(item.name);
            const finalImg = item.imgLink && item.imgLink !== '-' ? item.imgLink : 'https://images.unsplash.com/photo-1616469829581-73993eb86b02?q=80&w=300';
            return `
                <div class="card">
                    <div class="card-img-container"><img src="${finalImg}" alt="${item.name}" loading="lazy"></div>
                    <div class="card-content">
                        <h3 class="card-title">${item.name}</h3>
                        <div class="card-actions">
                            <a href="${item.watchLink}" target="_blank" class="btn-watch"><i class="fa-solid fa-play"></i> الشارة</a>
                            <button class="btn-fav ${isFav ? 'is-fav' : ''}" onclick="toggleFavorite('${item.name.replace(/'/g, "\\'")}')">
                                <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
        }

        // دالة رندرة الكروت وعرض المسلسلات بالكامل أو حسب الفلترة والبحث
        function renderContent() {
            seriesGrid.innerHTML = '';
            randomGrid.innerHTML = '';
            const searchTerm = searchInput.value.trim().toLowerCase();

            // 1. نظام العرض لقسم الصفحة الرئيسية (يوتيوب)
            if (activeTab === 'home') {
                let combinedData = [...allDataMap.general, ...allDataMap.kids, ...allDataMap.massa];
                
                // تصفية البحث الفوري إن وُجد
                if (searchTerm !== '') {
                    combinedData = combinedData.filter(item => item.name.toLowerCase().includes(searchTerm));
                }

                if (combinedData.length === 0) {
                    seriesGrid.innerHTML = '<div class="no-results">لم يتم العثور على نتائج للبحث.</div>';
                    return;
                }

                // توليد قسم "المقترحات العشوائية" فقط عند عدم وجود عملية بحث نشطة لثبات الأداء
                if (searchTerm === '') {
                    homeTitles.style.display = 'block';
                    const shuffled = [...combinedData].sort(() => 0.5 - Math.random());
                    const randomItems = shuffled.slice(0, 3); // سحب 3 شارات عشوائية في الصدارة بجانب بعضها
                    randomItems.forEach(item => randomGrid.innerHTML += createCardHtml(item));
                } else {
                    homeTitles.style.display = 'none';
                }

                // عرض بقية المسلسلات كاملة بالأسفل
                combinedData.forEach(item => seriesGrid.innerHTML += createCardHtml(item));
            } 
            // 2. نظام العرض لقسم المفضلة
            else if (activeTab === 'fav') {
                let combinedData = [...allDataMap.general, ...allDataMap.kids, ...allDataMap.massa];
                let favData = combinedData.filter(item => favorites.includes(item.name));

                // دعم تصفية البحث داخل المفضلة
                if (searchTerm !== '') {
                    favData = favData.filter(item => item.name.toLowerCase().includes(searchTerm));
                }

                // إزالة التكرار إن وُجد نفس الاسم في شيتات مختلفة
                let uniqueFavData = favData.filter((value, index, self) => self.findIndex(t => t.name === value.name) === index);

                if (uniqueFavData.length === 0) {
                    seriesGrid.innerHTML = '<div class="no-results">قائمة المفضلة فارغة حالياً أو لا تطابق البحث.</div>';
                    return;
                }
                uniqueFavData.forEach(item => seriesGrid.innerHTML += createCardHtml(item));
            } 
            // 3. نظام العرض لقنوات البث الفردية (العامة، الأطفال، ماسة)
            else {
                let channelData = allDataMap[activeTab] || [];
                if (searchTerm !== '') {
                    channelData = channelData.filter(item => item.name.toLowerCase().includes(searchTerm));
                }

                if (channelData.length === 0) {
                    seriesGrid.innerHTML = '<div class="no-results">لا توجد مسلسلات متوفرة حالياً أو تطابق البحث.</div>';
                    return;
                }
                channelData.forEach(item => seriesGrid.innerHTML += createCardHtml(item));
            }
        }

        window.toggleFavorite = function(name) {
            if (favorites.includes(name)) { favorites = favorites.filter(fav => fav !== name); } 
            else { favorites.push(name); }
            localStorage.setItem('majd_favs', JSON.stringify(favorites));
            updateFavCount();
            renderContent();
        }

        // دالة التنقل المتقدمة والتحكم في عناصر الشاشة والشعارات بحسب الترتيب المطلوب
        window.switchChannel = function(tabName) {
            activeTab = tabName;
            
            // تعديل أزرار التنقل النشطة بالتصميم
            const tabs = document.querySelectorAll('.nav-tab');
            tabs.forEach(tab => tab.classList.remove('active'));
            if(event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            } else {
                // تفعيل تبويب الرئيسية تلقائياً عند أول تشغيل للموقع
                document.querySelector('.nav-tab').classList.add('active');
            }

            // تصفير حقل البحث مؤقتاً عند التنقل لراحة تصفح الزائر
            searchInput.value = '';

            // إعادة ضبط الشعار وعناصر الرؤية بناءً على القسم النشط
            homeTitles.style.display = 'none';
            telegramSchedule.style.display = 'none';
            controlsBox.style.display = 'flex';
            seriesGrid.style.display = 'grid';

            if (tabName === 'home') {
                mainLogo.src = 'https://files.catbox.moe/ieu2w1.png'; // شعار دراما المجد الافتراضي للرئيسية
            } else if (tabName === 'schedule') {
                controlsBox.style.display = 'none';
                seriesGrid.style.display = 'none';
                telegramSchedule.style.display = 'flex';
                mainLogo.src = 'https://files.catbox.moe/ieu2w1.png';
                return; // إيقاف الرندرة للمسلسلات لأننا بتبويب الجدول
            } else if (tabName === 'fav') {
                mainLogo.src = 'https://files.catbox.moe/ieu2w1.png'; 
            } else {
                // جلب الشعار المخصص للقناة المحددة من أوبجكت القنوات العلوي
                mainLogo.src = channels[tabName].logo;
            }

            renderContent();
        }

        searchInput.addEventListener('input', renderContent);
        
        // إطلاق عملية جلب كافة البيانات الإجمالية فور فتح الموقع
        fetchAllData();
    </script>
</body>
</html>
