<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; padding: 20px; }
        .box { max-width: 800px; margin: auto; background: #111; padding: 20px; border-radius: 10px; border: 1px solid #ffd700; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #333; padding: 8px; text-align: center; }
        th { background: #222; color: #ffd700; }
        input { width: 90%; background: transparent; border: none; color: #fff; text-align: center; }
        button { width: 100%; padding: 15px; background: #ffd700; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
        textarea { width: 100%; height: 200px; margin-top: 20px; background: #000; color: #0f0; padding: 10px; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="box">
    <h3 style="text-align:center;">محرك إدخال الـ 200 مسلسل</h3>
    <table id="dataTable">
        <thead>
            <tr><th>اسم المسلسل</th><th>رابط الصورة</th><th>رابط الشارة</th></tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
    <button onclick="copyAll()">🔄 تجميع البيانات ونسخها تلقائياً</button>
    <textarea id="output" readonly placeholder="هنا ستظهر كل بياناتك بعد الضغط على الزر..."></textarea>
</div>

<script>
    // إنشاء 200 صف للجدول
    const tbody = document.getElementById('tableBody');
    for(let i=0; i<200; i++) {
        tbody.innerHTML += `<tr>
            <td><input type="text" class="title" placeholder="اسم"></td>
            <td><input type="text" class="img" placeholder="صورة"></td>
            <td><input type="text" class="link" placeholder="رابط"></td>
        </tr>`;
    }

    function copyAll() {
        const rows = document.querySelectorAll('#tableBody tr');
        let data = [];
        rows.forEach(row => {
            const title = row.querySelector('.title').value;
            const img = row.querySelector('.img').value;
            const link = row.querySelector('.link').value;
            if(title && link) data.push({title, img, link});
        });

        const output = JSON.stringify(data, null, 4);
        const textarea = document.getElementById('output');
        textarea.value = `const myShows = ${output};`;
        
        textarea.select();
        document.execCommand('copy');
        alert("تم التجميع والنسخ! الآن أرسلها لي هنا.");
    }
</script>
</body>
</html>
