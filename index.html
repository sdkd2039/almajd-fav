<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شارات دراما المجد</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif !important; }
        body { background-color: #0a0a0a; color: #ffffff; margin: 0; padding: 20px; }
        .header-logo { text-align: right; margin-bottom: 20px; }
        .header-logo img { width: 80px; }
        
        .add-form { background: #141414; border: 1px solid #ffd700; border-radius: 12px; padding: 20px; margin: 0 auto 30px auto; max-width: 500px; }
        input { width: 90%; padding: 10px; background: #222; border: 1px solid #444; border-radius: 6px; color: #fff; text-align: center; margin-bottom: 10px; }
        
        .btn { background: #ffd700; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-edit { background: #444; color: #fff; padding: 5px 10px; margin-top: 5px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-remove { background: #ff4d4d; color: white; padding: 5px 10px; cursor: pointer; border: none; border-radius: 4px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .card { background: #141414; border: 1px solid #252525; border-radius: 12px; padding: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="header-logo"><img src="https://files.catbox.moe/0hkqh4.png"></div>

    <div class="add-form">
        <h3 id="formTitle">➕ إضافة شارة جديدة</h3>
        <input type="hidden" id="editId">
        <input type="text" id="showTitle" placeholder="اسم المسلسل">
        <input type="url" id="showImg" placeholder="رابط صورة الكرت (اختياري)">
        <input type="url" id="showLink" placeholder="رابط الشارة (موقع شارات دراما المجد فقط)">
        <button class="btn" onclick="saveShow()" id="saveBtn">💾 حفظ في المكتبة</button>
    </div>

    <div class="grid" id="fav-sharat"></div>

<script>
    let myCustomSharat = JSON.parse(localStorage.getItem('userCustomSharat')) || [];
    let isEditing = false;

    function saveShow() {
        const id = document.getElementById('editId').value;
        const title = document.getElementById('showTitle').value;
        const link = document.getElementById('showLink').value;
        const img = document.getElementById('showImg').value || "https://via.placeholder.com/160x110/222222/ffffff?text=Drama";

        if (!title || !link || !link.includes("sites.google.com/view/almajddrama/")) {
            alert("تأكد من الاسم ورابط شارات دراما المجد الصحيح!");
            return;
        }

        if (isEditing) {
            myCustomSharat = myCustomSharat.map(item => item.id == id ? {id, title, img, link} : item);
            isEditing = false;
            document.getElementById('formTitle').innerText = "➕ إضافة شارة جديدة";
        } else {
            if(myCustomSharat.find(i => i.link === link)) { alert("هذه الشارة موجودة مسبقاً!"); return; }
            myCustomSharat.push({ id: Date.now(), title, img, link });
        }

        localStorage.setItem('userCustomSharat', JSON.stringify(myCustomSharat));
        render(); clearForm();
    }

    function editShow(id) {
        const item = myCustomSharat.find(i => i.id == id);
        document.getElementById('editId').value = item.id;
        document.getElementById('showTitle').value = item.title;
        document.getElementById('showLink').value = item.link;
        document.getElementById('showImg').value = item.img;
        document.getElementById('formTitle').innerText = "✏️ تعديل البيانات";
        isEditing = true;
    }

    function render() {
        document.getElementById('fav-sharat').innerHTML = myCustomSharat.map(item => `
            <div class="card">
                <img src="${item.img}" style="width:100%; height:110px; object-fit:cover; border-radius:6px;">
                <p style="font-weight:700;">${item.title}</p>
                <a href="${item.link}" target="_blank" style="color:#ffd700; text-decoration:none;">استماع الشارة</a><br>
                <button class="btn-edit" onclick="editShow(${item.id})">تعديل</button>
                <button class="btn-remove" onclick="removeShow(${item.id})">حذف</button>
            </div>
        `).join('');
    }

    function removeShow(id) {
        myCustomSharat = myCustomSharat.filter(i => i.id != id);
        localStorage.setItem('userCustomSharat', JSON.stringify(myCustomSharat));
        render();
    }

    function clearForm() {
        document.getElementById('showTitle').value = "";
        document.getElementById('showLink').value = "";
        document.getElementById('showImg').value = "";
    }

    render();
</script>
</body>
</html>
